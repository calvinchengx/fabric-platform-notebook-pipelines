# The emulator family, at a PINNED release — never `latest`.
#
# This repository exists to verify that a published fabric-emulator carries a
# whole platform. `latest` would make a green run unattributable: you would know
# something worked, but not which release.
#
# ONE VARIABLE PER IMAGE, NOT ONE FOR THE FAMILY. It ships on independent
# cadences, so fabric-emulator, entra, keyvault and arm sit on different version
# lines and a single pin cannot describe the stack. versions.env holds all of
# them and compose reads it directly with --env-file.
#
# Deliberately NOT copied from fabric-emulator's own compose file. That one is
# for people building the emulator; this one is what a consumer writes from the
# published docs, which is the thing this repo is here to prove is possible.
name: fabric-platform-notebook-pipelines

services:
# HOST PORTS ARE OVERRIDABLE, defaults unchanged.
# They default to the emulators' own ports, which is also what a standalone
# emulator or the family compose binds, so this stack could not come up beside
# either: `Bind for 0.0.0.0:8444 failed`. Nothing on the host side of this
# platform reaches these three ports (the steps talk to fabric-emulator and
# sqlserver), so the override is free: ENTRA_PORT=18443 KEYVAULT_PORT=18444
# ARM_PORT=18445 make up. FABRIC_PORT does the same for 9443, and the host
# side follows it without further change: the steps read the emulator through
# `fabric_target`, which already takes FABRIC_EMULATOR_URL / ENTRA_EMULATOR_URL,
# and scripts/demo.py and scripts/observe.py already take PORTAL_URL.
# The siblings moved to an 18xxx block by default;
# moving this one's defaults is a separate decision, because its registry
# entry and every witness that names a port would move with it.
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:?see versions.env}@${ENTRA_EMULATOR_DIGEST:?see versions.env}
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports: ["${ENTRA_PORT:-8443}:8443"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:?see versions.env}@${KEYVAULT_EMULATOR_DIGEST:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
    ports: ["${KEYVAULT_PORT:-8444}:8444"]
    environment:
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      # The image bakes KV_DATA_DIR=/data for volume users; no volume here, so
      # this must be emptied or the store fails to open a path that is not there.
      KV_DATA_DIR: ""

  # A Fabric CAPACITY is an ARM resource, not a Fabric one: it is created
  # through management.azure.com and only then appears on the Fabric control
  # plane. Provisioning creates one here (`platform/capacity.py`), which is the
  # same call an operator makes in Azure, so the emulator run exercises the
  # real ordering instead of leaning on a seeded capacity the emulator assigns
  # for convenience. Against real Fabric no capacity is created: one is named
  # in configuration and resolved.
  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:${ARM_EMULATOR_VERSION:?see versions.env}@${ARM_EMULATOR_DIGEST:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
    ports: ["${ARM_PORT:-8445}:8445"]
    environment:
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      ARM_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      ARM_ENTRA_TLS_INSECURE: "true"
      # The image bakes ARM_DATA_DIR for volume users; no volume here, so this
      # must be emptied or the store fails to open a path that is not there.
      # Same reason as keyvault above.
      ARM_DATA_DIR: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:?see versions.env}@${FABRIC_EMULATOR_DIGEST:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
      arm-emulator: {condition: service_healthy}
    # api.fabric + onelake.dfs + the portal, including the #flow view the
    # capture harness records while the pipeline runs.
    ports:
      - "${FABRIC_PORT:-9443}:9443"   # api.fabric + onelake.dfs + the portal
      - "${TDS_PORT:-11433}:1433"  # the Warehouse's T-SQL/TDS surface
    environment:
      # The Warehouse surface: the emulator terminates Entra FedAuth on 1433 and
      # relays to the SQL Server sidecar. Generous timeouts because the backend
      # dials lazily on first query and an emulated amd64 image is slow to boot.
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd};encrypt=disable;dial timeout=90;connection timeout=90"
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      # Notebook execution. With this set the emulator drives the spark-agent
      # itself, so a RunNotebook job runs and completes; without it the job
      # parks forever waiting for an engine, which is the honest behaviour when
      # there is none.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
      # Where capacities come from. The emulator polls ARM's family feed, so a
      # capacity created through Microsoft.Fabric/capacities shows up on
      # GET /v1/capacities under the Fabric GUID ARM assigned it.
      FABRIC_ARM_URL: "https://arm-emulator:8445"
      FABRIC_DATA_DIR: ""

# Source systems (mokapi, Postgres, Redpanda, Debezium) and OpenMetadata arrive
# in later phases. They are the world OUTSIDE the emulator and will live in
# their own compose files, composed in by the Makefile — so that what is
# emulator and what is source stays legible from the file layout alone.

  # --- Spark, because the platform must scale -------------------------------
  # bronze and silver are distributed transforms. In real Fabric they run in a
  # Spark notebook or a Spark Job Definition on a Spark pool; here they run
  # against Sail, the same engine the emulator's own advanced examples use.
  #
  # The PUBLISHED image, not a build: this repository is a consumer and may only
  # use what a consumer can pull.
  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_ENGINE_VERSION:?see versions.env}@${SAIL_ENGINE_DIGEST:?see versions.env}
    depends_on:
      fabric-emulator: {condition: service_healthy}
    ports:
      - "${SAIL_PORT:-50051}:50051"   # Spark Connect, plain h2c gRPC
    environment:
      # Sail mints its own storage token before starting: Rust object_store
      # reads credentials from the process environment at startup only, so a
      # Connect client cannot hand it one later.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"

  # The statement executor the emulator drives to RUN a notebook.
  #
  # WHY THIS EXISTS. A Fabric notebook job is executed by a Spark pool that
  # reports back; the emulator mirrors that and will not complete a job on a
  # clock, so something has to execute the cells. Until 0.15.0 nothing a
  # consumer could pull did — the published image shipped without the agent in
  # it — and this platform had to play the pool itself, in a driver that existed
  # only because of that gap.
  #
  # With this service the emulator executes the notebook, which is what real
  # Fabric does and one fewer thing this repository has to pretend about.
  spark-agent:
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_CLIENT_VERSION:?see versions.env}@${SPARK_CLIENT_DIGEST:?see versions.env}
    depends_on:
      sail: {condition: service_started}
    volumes:
      # THE DATA PRODUCT, ON THE ENGINE. bronze and silver import
      # `contoso_product`, and they run here, not in the client. The notebooks
      # declare a Fabric **Environment** (see platform/environment.py), which is
      # what real Fabric resolves and what this platform models.
      #
      # The emulator does not apply it on this path. Its ledger is precise about
      # the split: an Environment is "applied to the session" for Livy sessions
      # and Spark Job Definitions, while notebook cell execution "resolves
      # attached lakehouse/Environment METADATA". A RunNotebook job parses the
      # binding and never hands it to the agent, so the import would fail with
      # ModuleNotFoundError, measured rather than assumed.
      #
      # `/opt/wheels` is the emulator's own documented fallback for exactly this:
      # the agent installs whatever is bind-mounted there at startup. Staged by
      # scripts/compose.py before every `up`. The notebooks are unchanged by it,
      # so this is a difference in the local STACK and not in the platform's
      # code, and against real Fabric the Environment alone does the job.
      - ../.wheels:/opt/wheels:ro
    environment:
      SPARK_REMOTE: "sc://sail:50051"   # a Spark Connect client of sail; no JVM
      # delta-rs reaches OneLake on its own account: a Connect client cannot
      # read back the bearer sail holds, so the agent mints its own from the
      # same issuer with the same Storage audience.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_FORGE_URL: "https://entra-emulator:8443/admin/api/tokens"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
    # `started` is not `listening`: the agent builds a Spark session before it
    # binds, and a notebook submitted in that window fails on connection
    # refused — which reads as a broken feature rather than a startup race.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40

  # The T-SQL engine behind the Warehouse. Not an emulator invention: a Fabric
  # Warehouse IS a T-SQL engine reached over TDS, and this is a real one.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${SQLSERVER_VERSION:?see versions.env}@${SQLSERVER_DIGEST:?see versions.env}
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}",
             "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # dbt against the Warehouse. A one-shot, not a service: `docker compose run`.
  # Profile-gated so `make up` never builds it — the build is a few hundred MB
  # and only gold needs it.
  dbt:
    profiles: [gold]
    build:
      context: ..
      dockerfile: docker/dbt/Dockerfile
    depends_on:
      fabric-emulator: {condition: service_healthy}
      sqlserver: {condition: service_healthy}
    volumes:
      # THE PRODUCT'S gold DIRECTORY, not this platform's. The product stages
      # its dbt project there and reads the artefacts back from it; mounting
      # `../gold` meant dbt built whatever was left in the PLATFORM from an
      # earlier run. That is not a missing file -- it is a passing run over
      # stale models, which reported `PASS=61` against a project staged half a
      # day earlier. The one failure mode worse than a crash.
      - ${PRODUCT_GOLD:?set by the Makefile from PRODUCT}:/gold
      # The TDS helpers that need the driver but are not dbt models.
      - ../docker/dbt:/tools:ro
    environment:
      # The Warehouse is reached over the compose network, so the container
      # addresses the emulator by service name on the standard TDS port.
      DBT_HOST: "fabric-emulator"
      DBT_PORT: "1433"
      DBT_DATABASE: "${WAREHOUSE_ID:-unset-run-make-verify}"
      DBT_ACCESS_TOKEN: "${WAREHOUSE_TOKEN:-unset-run-make-verify}"
