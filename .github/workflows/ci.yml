# The repository's own gate: does it hold together, on all three platforms?
#
# "Works on Windows, macOS and Linux" is exactly the kind of claim that rots
# silently — it is true when written and nobody notices the day it stops being
# true. So it is asserted here on every push, by running the SAME make targets
# a user runs, on all three.
name: CI

on:
  push: {branches: [main]}
  pull_request:

# THE DEFAULT TOKEN IS NOT READ-ONLY, so say what this workflow may do.
# CodeQL's `actions/missing-workflow-permissions` flags a job that sets none:
# it inherits whatever the repository default is, which is a write token in
# many configurations and is never what a build needs. Declared here rather
# than per job, so a job added later cannot forget it; a job that genuinely
# needs more escalates in its own `permissions:` block, which overrides this.
permissions:
  contents: read

jobs:
  repo:
    name: make targets work
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Checked out into a NAMED directory, with the vendors beside it, because
    # doctor.py and compose.py resolve `ROOT.parent / "contoso-sources"`. A bare
    # checkout puts this repo at the workspace root, which makes that parent the
    # runner's work directory and the declaration unfindable. Same shape as
    # acceptance.yml here and in the sibling platforms.
    defaults:
      run:
        working-directory: fabric-platform-notebook-pipelines
    steps:
      - uses: actions/checkout@v7
        with:
          path: fabric-platform-notebook-pipelines
      # The vendors are DECLARED in contoso-sources and materialised from it.
      # Not vendorable here: the point of reading another repository's
      # declaration is that this platform's vendor list is not a copy.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # GNU Make is not on the Windows image. This is the same one-line install
      # the README tells a Windows user to run, so CI proves the instruction.
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
      # `make help` and `make test` need nothing but uv — no Docker, no
      # emulator, no published wheels. They are the part that is green today.
      - run: make help
      - run: make lint
      - run: make test
      # Reports, never fails on PENDING: the fixture wheels are published by
      # fabric-emulator's release workflow, and until a release carries them
      # this repo is legitimately waiting. Saying so out loud beats a skip.
      #
      # GitHub's macOS runners ship NO DOCKER — a documented fact about the
      # image, not a defect here — so `make doctor` correctly fails there and
      # `make config` has no `docker compose` to call.
      # The declaration alone is not enough: compose.py wants the materialised
      # bytes under _data/, because mokapi otherwise invents plausible bodies
      # from the OpenAPI schema and every step lands invented data.
      - name: Materialise the vendor exports
        run: make sources
        working-directory: contoso-sources
      - if: matrix.os != 'macos-latest'
        run: make doctor
      # Proves the compose file parses and the pin resolves, without pulling
      # a single image.
      - if: matrix.os != 'macos-latest'
        run: make config
      # macOS gets the STRONGER check, not a skip. Asserting that doctor
      # detects the missing daemon exercises its failure path — the branch a
      # user actually hits on a fresh machine, and the one that never runs
      # anywhere Docker is installed. A skip would prove nothing and would
      # hide the day doctor stops noticing.
      - if: matrix.os == 'macos-latest'
        name: doctor reports the absent Docker rather than passing blindly
        run: |
          if out=$(make doctor 2>&1); then
            echo "$out"
            echo "::error::doctor passed on a runner with no Docker installed"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "MISS.*docker" || {
            echo "::error::doctor failed but never named docker as the cause"
            exit 1
          }
          echo "doctor correctly reported the absent Docker daemon"
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
