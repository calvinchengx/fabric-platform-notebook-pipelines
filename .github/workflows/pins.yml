# The cells in this engine group must run the SAME the Fabric emulator and the Entra issuer it trusts, or a difference in
# their gold numbers is unattributable -- it could be the orchestrator or it
# could be the engine, and nobody could say which.
#
# THIS RUNS ON A SCHEDULE BECAUSE THE DRIFT ARRIVES FROM ANOTHER REPOSITORY.
# A check that fires only on push and pull_request needs a commit HERE, and a
# sibling moving its pin is not that. The Databricks pair learned this the
# expensive way: its check was correct for weeks while nothing asked it. See
# G53 in contoso-data-product/docs/01-plan.md.
#
# EXPECT THIS RED WHEN IT LANDS. These pins have already drifted; the check is
# reporting a real difference, not a broken workflow. Closing it is a decision
# about which version this group should run, and the fix is to move the pins
# with scripts/refresh_digests.py -- both halves together, because docker
# ignores the tag in `repo:tag@sha256:...` and the digest silently wins.
#
# NOT COMPARED, deliberately: AIRFLOW_VERSION. The airflow3 cell runs 3.3.1
# and the built-in cell runs 2.10.5 -- that difference IS the two cells, and
# a check that flagged it would be manufacturing a failure out of the point.
# POSTGRES, REDIS and PYTHON are each cell's own infrastructure, not the
# shared stack.
#
# NOT COMPARED, and it should be: Sail and the Spark client. The two Airflow
# cells call them SAIL_ENGINE_* and SPARK_CLIENT_*; notebook-pipelines calls
# the same images SAIL_* and SPARK_AGENT_*. One component under two names
# cannot be compared across the group, and they HAVE drifted (0.32.0 against
# 0.33.0 between the two Airflow cells). Unifying the names is a prerequisite,
# and it is a rename rather than CI work. See G53.
#
# GitHub disables schedules in a repository with 60 days of no activity, and
# says so by email. If this stops reporting, that is the first thing to check.
name: Pins

on:
  schedule:
    - cron: '23 6 * * *' # daily -- a sibling can move on any day
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # so a suspected drift can be confirmed without waiting

permissions:
  contents: read

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    name: pins match the rest of the fabric group
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: compare against every sibling cell
        run: |
          set -a; . ./versions.env; set +a
          fail=0
          for sib in fabric-platform-airflow3 fabric-platform-airflow-builtin; do
            curl -fsSL "https://raw.githubusercontent.com/calvinchengx/$sib/main/versions.env" -o /tmp/$sib.env
            echo "--- $sib ---"
            for name in FABRIC_EMULATOR ENTRA_EMULATOR SAIL_ENGINE SPARK_CLIENT; do
              # BOTH halves. A version that agrees while the digest does not is
              # two cells pulling different bytes under the same label.
              halves="VERSION DIGEST"
            case $name in SAIL_ENGINE|SPARK_CLIENT) halves="VERSION DIGEST RELEASE";; esac
            for half in $halves; do
                var="${name}_${half}"
                mine=$(eval echo \$$var)
                theirs=$(grep -E "^$var=" /tmp/$sib.env | cut -d= -f2- || true)
                if [ -z "$theirs" ]; then
                  echo "::warning::$var is not pinned by $sib"
                elif [ "$mine" != "$theirs" ]; then
                  echo "::error::$var is $mine here and $theirs in $sib"
                  fail=1
                else
                  echo "ok $var=$mine"
                fi
              done
            done
          done
          exit $fail

      - name: the release label matches what versions.env claims
        run: |
          set -a; . ./versions.env; set +a
          fail=0
          # THREE THINGS THE TAG CANNOT TELL YOU, checked against the image.
          #
          # emulator-sail and emulator-spark-agent are tagged for the DEPENDENCY
          # they carry, so `0.7.0` says which Sail is inside and nothing about
          # the launcher beside it -- which moves every emulator release and is
          # republished under that same tag.
          for pair in "SAIL_ENGINE emulator-sail" "SPARK_CLIENT emulator-spark-agent"; do
            set -- $pair; name=$1; img=ghcr.io/calvinchengx/$2
            v=$(eval echo \$${name}_VERSION)
            d=$(eval echo \$${name}_DIGEST)
            r=$(eval echo \$${name}_RELEASE)

            # 1. The tag still names THIS build. If the dependency moved on --
            #    pysail 0.7.0 -> 0.8.0 -- the old tag stops pointing here and the
            #    pin quietly keeps an engine nobody chose.
            actual=$(docker buildx imagetools inspect "$img:$v" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -z "$actual" ]; then
              echo "::error::$img:$v does not resolve -- has the dependency version moved?"; fail=1
            elif [ "$actual" != "$d" ]; then
              echo "::error::$img:$v now resolves to $actual, but ${name}_DIGEST pins $d. The tag was republished, or the dependency moved."; fail=1
            fi

            # 2. _RELEASE is DERIVED. Read it off the image rather than trusting
            #    the file, or it is just a comment that happens to look checked.
            label=$(docker buildx imagetools inspect "$img@$d" --format '{{json .Image}}' 2>/dev/null \
              | python3 -c "import json,sys;d=json.load(sys.stdin);v={((i.get('config') or {}).get('Labels') or {}).get('org.opencontainers.image.version') for i in d.values()};v.discard(None);print(sorted(v)[0] if len(v)==1 else '')" || true)
            if [ -z "$label" ]; then
              echo "::error::$img@$d carries no single org.opencontainers.image.version label"; fail=1
            elif [ "$label" != "$r" ]; then
              echo "::error::${name}_RELEASE says $r but the image says $label"; fail=1
            fi

            # 3. The engine came from the emulator release we run. Without this,
            #    a bumped dependency tag can leave the engine a release behind
            #    while every version string still reads correct.
            if [ "$r" != "$FABRIC_EMULATOR_VERSION" ]; then
              echo "::error::${name}_RELEASE is $r but FABRIC_EMULATOR_VERSION is $FABRIC_EMULATOR_VERSION -- engine and emulator are from different releases"; fail=1
            fi
            [ "$fail" = 0 ] && echo "ok $name: tag $v -> $d, packaged by $label"
          done
          exit $fail
